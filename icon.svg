<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0e0e11"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3742fa"/>
      <stop offset="100%" stop-color="#2ed573"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景角丸スクエア -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2a2a32" stroke-width="6"/>

  <!-- メトロノーム本体フレーム（ピラミッド型） -->
  <path d="M 210 110 L 140 390 L 372 390 L 302 110 Z" fill="#25252b" stroke="#3d3d46" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- 振り子の目盛プレート -->
  <polygon points="225,140 180,360 332,360 287,140" fill="#18181c"/>
  
  <!-- 振り子の中心軸線 -->
  <line x1="256" y1="140" x2="256" y2="350" stroke="#444450" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- 振り子ロッド（傾斜角） -->
  <line x1="256" y1="360" x2="190" y2="130" stroke="#f1f2f6" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 振り子の錘（おもり / ウェイト） -->
  <circle cx="212" cy="208" r="26" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="5" filter="url(#glow)"/>

  <!-- ピボット（支点） -->
  <circle cx="256" cy="360" r="14" fill="#ff4757"/>

  <!-- 録音・レコーダーの象徴（下部の音波または赤いRECドット） -->
  <circle cx="370" cy="140" r="14" fill="#ff4757" filter="url(#glow)"/>
</svg>
